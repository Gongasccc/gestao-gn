<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ninho</title>
  <meta name="description" content="Ninho: a casa e a vida a dois, organizadas num só sítio.">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ninho">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/brand/ninho.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/ninho-32.png">
  <link rel="apple-touch-icon" href="assets/brand/ninho-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/modules/auth.css">
  <link rel="stylesheet" href="css/modules/dashboard.css">
  <link rel="stylesheet" href="css/modules/trips.css">
  <link rel="stylesheet" href="css/modules/recipes.css">
  <link rel="stylesheet" href="css/modules/misc.css">
  <link rel="stylesheet" href="css/modules/couple.css">
  <link rel="stylesheet" href="css/modules/farmacia.css">
  <link rel="stylesheet" href="css/modules/faturas.css">
  <link rel="stylesheet" href="css/modules/supermercados.css">
  <link rel="stylesheet" href="css/modules/lista.css">
  <link rel="stylesheet" href="css/desktop.css">
</head>
<body>
  <!-- Entrada / registo -->
  <div id="auth-overlay" class="auth">
    <div class="auth__logo-wrap">
      <img src="assets/brand/ninho.svg" class="auth__icon" alt="">
      <span class="auth__name">Ninho</span>
    </div>

    <div id="auth-loading" class="auth__loading">
      <span class="spinner"></span>
      <p class="muted small">A verificar sessão…</p>
    </div>

    <form id="auth-card" class="auth__card glass" style="display:none" onsubmit="return false" novalidate>
      <h2 class="auth__title" id="auth-title">Bem-vindos de volta</h2>
      <input type="text" id="auth-username" class="input" placeholder="Utilizador ou email" autocomplete="username" autocapitalize="none" data-enter="auth:submit">
      <input type="password" id="auth-password" class="input" placeholder="Password" autocomplete="current-password" data-enter="auth:submit">
      <div class="auth__confirm" id="auth-confirm-wrap">
        <input type="password" id="auth-confirm" class="input" placeholder="Confirmar password" autocomplete="new-password" data-enter="auth:submit">
      </div>
      <div class="auth__confirm" id="auth-email-wrap">
        <input type="email" id="auth-email" class="input" placeholder="Email para recuperar a password (opcional)" autocomplete="email" autocapitalize="none" data-enter="auth:submit">
      </div>
      <p class="auth__hint" id="auth-hint" hidden>Escreve o teu utilizador ou o email que associaste à conta. Enviamos um link para definires uma nova password.</p>
      <button type="button" class="btn btn--primary btn--block btn--large pressable" id="auth-submit" data-action="auth:submit">Entrar</button>
      <p class="auth__error" id="auth-error" hidden></p>
      <button type="button" class="link" id="auth-toggle" data-action="auth:toggle">Não tens conta? Cria uma aqui.</button>
      <button type="button" class="link link--muted" id="auth-forgot" data-action="auth:forgot">Esqueceste-te da password?</button>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="app">
    <div id="sidebar-overlay" class="sidebar-overlay" data-action="sidebar:close"></div>
    <aside id="sidebar" class="sidebar" aria-label="Menu"></aside>

    <div class="app__main">
      <header class="topbar" id="topbar">
        <div class="topbar__side" id="topbar-left"></div>
        <h1 class="topbar__title" id="topbar-title">Início</h1>
        <div class="topbar__side topbar__side--right">
          <span class="topbar__actions" id="topbar-right"></span>
          <button class="icon-btn topbar-bell pressable" data-nav-page="menu-notificacoes" data-action="nav:go" data-page="menu-notificacoes" aria-label="Notificações" title="Notificações">
            <span class="topbar-bell__icon"></span>
            <span class="badge" data-badge="notifications" hidden></span>
          </button>
        </div>
      </header>

      <!-- As páginas são geradas pelos módulos em js/modules -->
      <main id="page-container" class="page-container"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação principal"></nav>
  </div>

  <div id="modal-root"></div>

  <script>
    // Se a app ficar presa a "verificar sessão" (erro ao carregar ou base de dados local bloqueada),
    // mostra o motivo e botões para tentar outra vez ou limpar os dados locais (a conta e os dados na nuvem ficam).
    (function () {
      var erros = [];
      function guardar(msg) { if (msg && erros.length < 3) erros.push(String(msg).slice(0, 200)); }
      window.addEventListener('error', function (e) { guardar(e.message || (e.target && e.target.src ? 'Falhou: ' + e.target.src : '')); }, true);
      window.addEventListener('unhandledrejection', function (e) { guardar(e.reason && (e.reason.message || e.reason)); });
      function limpar() {
        var tarefas = [];
        try {
          if (indexedDB.databases) {
            tarefas.push(indexedDB.databases().then(function (dbs) {
              return Promise.all(dbs.filter(function (d) { return d.name && d.name.indexOf('firestore') === 0; })
                .map(function (d) { return new Promise(function (ok) { var r = indexedDB.deleteDatabase(d.name); r.onsuccess = r.onerror = r.onblocked = function () { ok(); }; }); }));
            }));
          }
        } catch (e) { /* sem IndexedDB */ }
        if (window.caches) tarefas.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        if (navigator.serviceWorker) tarefas.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        Promise.all(tarefas).catch(function () {}).then(function () { location.reload(); });
      }
      setTimeout(function () {
        var caixa = document.getElementById('auth-loading');
        if (!caixa || caixa.hidden || document.body.classList.contains('is-authed') || caixa.offsetParent === null) return;
        var div = document.createElement('div');
        div.className = 'auth__preso';
        div.innerHTML = '<p class="muted small">Está a demorar mais do que o normal.</p>'
          + (erros.length ? '<p class="small auth__preso-erro"></p>' : '')
          + '<button type="button" class="btn pressable" data-x="tentar">Tentar outra vez</button>'
          + '<button type="button" class="btn btn--primary pressable" data-x="limpar">Limpar dados locais e entrar</button>';
        if (erros.length) div.querySelector('.auth__preso-erro').textContent = erros.join(' · ');
        div.querySelector('[data-x="tentar"]').onclick = function () { location.reload(); };
        div.querySelector('[data-x="limpar"]').onclick = function (ev) { ev.target.disabled = true; ev.target.textContent = 'A limpar…'; limpar(); };
        caixa.appendChild(div);
      }, 12000);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
