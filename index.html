<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Gestão G&amp;N</title>
  <meta name="description" content="Gestão G&N: a app de organização do casal.">
  <meta name="theme-color" content="#07070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gestão G&amp;N">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/brand/logopreto_fundobranco.png">
  <link rel="apple-touch-icon" href="assets/brand/logopreto_fundobranco.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/modules/auth.css">
  <link rel="stylesheet" href="css/modules/dashboard.css">
  <link rel="stylesheet" href="css/modules/trips.css">
  <link rel="stylesheet" href="css/modules/recipes.css">
  <link rel="stylesheet" href="css/modules/misc.css">
  <link rel="stylesheet" href="css/modules/couple.css">
  <link rel="stylesheet" href="css/modules/farmacia.css">
  <link rel="stylesheet" href="css/modules/faturas.css">
</head>
<body>
  <!-- Brilho amarelo a mexer por baixo do vidro -->
  <div class="ambient" aria-hidden="true">
    <span class="ambient__blob ambient__blob--1"></span>
    <span class="ambient__blob ambient__blob--2"></span>
    <span class="ambient__blob ambient__blob--3"></span>
  </div>
  <!-- Entrada / registo -->
  <div id="auth-overlay" class="auth">
    <div class="auth__logo-wrap">
      <img src="assets/brand/logobranco_semfundo.png" class="auth__logo auth__logo--dark" alt="G&amp;N">
      <img src="assets/brand/logopreto_semfundo.png" class="auth__logo auth__logo--light" alt="G&amp;N">
    </div>

    <div id="auth-loading" class="auth__loading">
      <span class="spinner"></span>
      <p class="muted small">A verificar sessão…</p>
    </div>

    <form id="auth-card" class="auth__card glass" style="display:none" onsubmit="return false" novalidate>
      <h2 class="auth__title" id="auth-title">Bem-vindos de volta</h2>
      <input type="text" id="auth-username" class="input" placeholder="Utilizador ou email" autocomplete="username" autocapitalize="none" data-enter="auth:submit">
      <input type="password" id="auth-password" class="input" placeholder="Password" autocomplete="current-password" data-enter="auth:submit">
      <div class="auth__confirm" id="auth-confirm-wrap">
        <input type="password" id="auth-confirm" class="input" placeholder="Confirmar password" autocomplete="new-password" data-enter="auth:submit">
      </div>
      <div class="auth__confirm" id="auth-email-wrap">
        <input type="email" id="auth-email" class="input" placeholder="Email para recuperar a password (opcional)" autocomplete="email" autocapitalize="none" data-enter="auth:submit">
      </div>
      <p class="auth__hint" id="auth-hint" hidden>Escreve o teu utilizador ou o email que associaste à conta. Enviamos um link para definires uma nova password.</p>
      <button type="button" class="btn btn--primary btn--block btn--large pressable" id="auth-submit" data-action="auth:submit">Entrar</button>
      <p class="auth__error" id="auth-error" hidden></p>
      <button type="button" class="link" id="auth-toggle" data-action="auth:toggle">Não tens conta? Cria uma aqui.</button>
      <button type="button" class="link link--muted" id="auth-forgot" data-action="auth:forgot">Esqueceste-te da password?</button>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="app">
    <div id="sidebar-overlay" class="sidebar-overlay" data-action="sidebar:close"></div>
    <aside id="sidebar" class="sidebar glass glass--strong" aria-label="Menu"></aside>

    <div class="app__main">
      <header class="topbar glass glass--bar" id="topbar">
        <div class="topbar__side" id="topbar-left"></div>
        <h1 class="topbar__title" id="topbar-title">Início</h1>
        <div class="topbar__side topbar__side--right" id="topbar-right"></div>
      </header>

      <!-- As páginas são geradas pelos módulos em js/modules -->
      <main id="page-container" class="page-container"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação principal"></nav>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
